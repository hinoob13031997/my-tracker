name: verify

# Same checks CLAUDE.md asks for by hand: syntax of every script, unit tests of the data layer,
# formatting, real-bug lint, then the headless walkthrough (5 sections, Fitness tabs, behaviour scenarios,
# overflow, service worker, JS errors).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (node --check)
        run: |
          set -e
          for f in *.js scripts/*.js; do node --check "$f"; done

      - name: Unit tests (data layer, no browser)
        run: node scripts/stack-unit.js

      - name: Install Playwright + Chromium + ESLint + Prettier
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i playwright eslint@10 prettier@3
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Format check (Prettier, JS only — `npm run format` fixes it)
        run: node "$RUNNER_TEMP/pw/node_modules/prettier/bin/prettier.cjs" --check "*.js" "scripts/*.js"

      - name: Lint (undefined names, duplicate keys, unreachable code …)
        run: node scripts/stack-lint.js

      - name: Headless verification
        run: node scripts/stack-verify.js
        env:
          # pin the app's clock: workout vs rest day scenarios must not depend on the weekday CI runs on
          STACK_VERIFY_DATE: '2026-10-02'
